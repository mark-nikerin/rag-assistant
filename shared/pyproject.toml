[project]
name = "rag-shared"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mark", email = "mrnikerin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
